name: Android

# Every push to main produces a build testers can install. The web layer
# already updates itself on deploy (the shell loads hypefy.chat), so this
# exists only for changes to the native shell — plugins, permissions,
# manifest, icons — which a Vercel deploy cannot reach.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is `git rev-list --count HEAD`, which is 1 on a
          # shallow clone — every build would then collide and refuse to
          # install over the last one.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      # Copies web assets and plugin registrations into the native project.
      # Required even though the shell loads a remote URL: plugin wiring lives
      # in the Android project and is regenerated here.
      - name: Capacitor sync
        run: npx cap sync android

      - name: Restore google-services.json
        # Firebase config is not in the repo. Without it the build still
        # succeeds — the gradle file treats it as optional — but push
        # notifications will not work in the resulting APK.
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Restore keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        working-directory: android
        env:
          # Unset when the secret is absent, which makes build.gradle fall
          # back to debug signing rather than failing.
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Always kept, so a build is retrievable even if distribution is not
      # configured yet or the upload step fails.
      - uses: actions/upload-artifact@v4
        with:
          name: hypefy-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Send to testers
        if: ${{ secrets.FIREBASE_APP_ID != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message }}
