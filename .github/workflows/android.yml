name: Android (Capacitor shell — retired)

# **This builds the OLD app, and it must never produce a Play artifact.**
#
# It was written when the Capacitor shell WAS Hypefy on Android: a WebView
# pointed at app.hypefy.chat, so the only reason to build it was a change to
# the native wrapper that a Vercel deploy could not reach.
#
# Phase 6 replaced it. The app is `apps/mobile` (Expo), built by EAS, and
# EAS signs with credentials it stores itself — which is why 1.0.0, 1.1.0 and
# 1.2.0 all signed correctly with no secret in this repository.
#
# **The dangerous state this now guards against.** `KEYSTORE_BASE64` is read
# by nothing but `android/app/build.gradle`. Set it, and this workflow starts
# producing a correctly-signed, Play-publishable App Bundle of the RETIRED
# WEBVIEW APP — the wrong application, properly signed, previously labelled
# "the Play Store artifact" and built on every merge. A wrong app that is
# correctly signed is far more likely to be uploaded by mistake than one Play
# rejects outright. So the bundle is gone and the secret is now a hard
# failure here rather than a warning.
#
# It builds an APK only, for Firebase App Distribution, and only when somebody
# asks for one. Play's artifact comes from `eas build --profile production`.
on:
  # Manual only. On every push it produced an installable build of an app
  # nobody should install, which is worse than producing nothing.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Secrets are lifted into env because GitHub does not allow the `secrets`
    # context inside `if:` expressions — referencing it there fails the whole
    # workflow before any step runs. `env` is allowed, so every "is this
    # configured?" check below reads from here.
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      # Optional. Unset means the release still uploads, it just is not
      # auto-assigned to a group — see the distribute step.
      FIREBASE_TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP }}

    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is `git rev-list --count HEAD`, which is 1 on a
          # shallow clone — every build would then collide and Android would
          # refuse to install it over the previous one.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >= 22 and refuses to run on 20.
          # ci.yml stays on 20 — it only builds Next, which is happy there.
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy "tools" package,
          # which newer sdkmanagers no longer have — every build failed here
          # from 2026-09-12. Gradle fetches the platform and build tools it
          # needs by itself.
          packages: platform-tools

      # Copies web assets and plugin registrations into the native project.
      # Required even though the shell loads a remote URL: the plugin wiring
      # lives in the Android project and is regenerated here.
      - name: Capacitor sync
        run: npx cap sync android

      - name: Restore google-services.json
        # Firebase config is not in the repo. Without it the build still
        # succeeds — build.gradle treats the file as optional — but push
        # notifications will not work in the resulting APK.
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Restore keystore
        if: env.KEYSTORE_BASE64 != ''
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        working-directory: android
        env:
          # Empty when no keystore secret is set, which makes build.gradle
          # fall back to debug signing rather than failing the build.
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Belt and braces: the exec bit is set in git, but a Windows
        # checkout can drop it again and the failure (exit 126) is opaque.
        #
        # An APK only. The .aab used to be built here as well, because Play
        # accepts nothing else — which is exactly why it has no business
        # being produced from the retired shell. Play's bundle comes from
        # EAS; an APK is only sideloaded or sent through Firebase App
        # Distribution, neither of which can reach the store.
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      # Always kept, so a build is retrievable even when distribution is not
      # configured yet or the upload step fails.
      # Short-lived, and never allowed to fail the run: once the account's
      # artifact storage filled up, this step failed and the build never
      # reached testers.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: hypefy-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Inverted from what this used to say, because what is dangerous has
      # inverted. It warned when the keystore was ABSENT, on the reasoning
      # that Play would reject a debug-signed bundle — true, and a rejection
      # is a safe failure. Now that Play's artifact comes from EAS, the
      # keystore being PRESENT is the problem: it signs the retired WebView
      # app with the real upload key, and nothing downstream can tell that
      # apart from the app anybody meant to ship.
      - name: Refuse to sign the retired shell with the release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "::error title=Release keystore set on the retired shell::KEYSTORE_BASE64 is set, so this workflow would sign the Capacitor WebView app with the real upload key. That app is retired; Play's artifact comes from 'eas build --profile production', which signs with credentials EAS stores. Remove the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets from this repository — EAS does not read them — or delete this workflow along with android/."
          exit 1

      # The same treatment for Firebase. google-services.json used to be
      # committed, so this step's "if set" was harmless — the file was there
      # either way. Now that it is untracked, an unset secret means an APK
      # that installs, runs, and silently never receives a notification.
      # build.gradle treats the file as optional, so nothing else complains.
      - name: Warn when push is not configured
        if: env.GOOGLE_SERVICES_JSON == ''
        run: |
          echo "::warning title=No Firebase config::google-services.json was not restored, so push notifications will not work in this build. Set the GOOGLE_SERVICES_JSON secret (base64 of the file)."

      - name: Send to testers
        if: env.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Only assign a group when one is configured. Hardcoding "testers"
          # failed the whole build with a 404 once the upload had already
          # succeeded, which is the worst of both: the release existed, and CI
          # said the run failed.
          groups: ${{ env.FIREBASE_TESTER_GROUP }}
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message }}
