name: Android

# Every push to main produces a build testers can install. The web layer
# already updates itself on deploy (the shell loads hypefy.chat), so this
# exists only for changes to the native shell — plugins, permissions,
# manifest, icons — which a Vercel deploy cannot reach.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Secrets are lifted into env because GitHub does not allow the `secrets`
    # context inside `if:` expressions — referencing it there fails the whole
    # workflow before any step runs. `env` is allowed, so every "is this
    # configured?" check below reads from here.
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      # Optional. Unset means the release still uploads, it just is not
      # auto-assigned to a group — see the distribute step.
      FIREBASE_TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP }}

    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is `git rev-list --count HEAD`, which is 1 on a
          # shallow clone — every build would then collide and Android would
          # refuse to install it over the previous one.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >= 22 and refuses to run on 20.
          # ci.yml stays on 20 — it only builds Next, which is happy there.
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy "tools" package,
          # which newer sdkmanagers no longer have — every build failed here
          # from 2026-09-12. Gradle fetches the platform and build tools it
          # needs by itself.
          packages: platform-tools

      # Copies web assets and plugin registrations into the native project.
      # Required even though the shell loads a remote URL: the plugin wiring
      # lives in the Android project and is regenerated here.
      - name: Capacitor sync
        run: npx cap sync android

      - name: Restore google-services.json
        # Firebase config is not in the repo. Without it the build still
        # succeeds — build.gradle treats the file as optional — but push
        # notifications will not work in the resulting APK.
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Restore keystore
        if: env.KEYSTORE_BASE64 != ''
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        working-directory: android
        env:
          # Empty when no keystore secret is set, which makes build.gradle
          # fall back to debug signing rather than failing the build.
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Belt and braces: the exec bit is set in git, but a Windows
        # checkout can drop it again and the failure (exit 126) is opaque.
        # Both outputs, because they are not interchangeable: Play accepts
        # only an .aab, and only an .apk can be sideloaded or sent through
        # Firebase App Distribution.
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      # Always kept, so a build is retrievable even when distribution is not
      # configured yet or the upload step fails.
      # Short-lived, and never allowed to fail the run: once the account's
      # artifact storage filled up, this step failed and the build never
      # reached testers.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: hypefy-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # The Play Store artifact. Google has required an App Bundle for new
      # apps since 2021, so assembleRelease alone can never produce a
      # publishable build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: hypefy-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Say so in the run summary rather than letting Play reject the
      # upload with a signature error that reads like a Play problem.
      - name: Warn when the bundle is debug-signed
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning title=Debug-signed bundle::hypefy-aab is signed with the debug key and Google Play will reject it. Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD to produce an upload-signed bundle."

      - name: Send to testers
        if: env.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Only assign a group when one is configured. Hardcoding "testers"
          # failed the whole build with a 404 once the upload had already
          # succeeded, which is the worst of both: the release existed, and CI
          # said the run failed.
          groups: ${{ env.FIREBASE_TESTER_GROUP }}
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message }}
