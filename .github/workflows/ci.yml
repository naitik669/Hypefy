name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed by the changed-files lint below, which diffs against the
          # base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The whole repo, surfaced and not gated. Measured on 16 Nov 2026: 294
      # errors and 40 warnings. Making this blocking would turn CI red on the
      # first run and the only ways out would be fixing 294 things at once or
      # reverting the gate — so it stays a report.
      - name: Lint (whole repo, non-blocking)
        run: npm run lint || true

      # The ratchet, against a recorded baseline (.eslint-debt.json).
      #
      # This step used to run `npx eslint $files` and require ZERO errors in
      # every changed file. That is not a ratchet, it is a freeze: a file
      # carrying pre-existing debt could not be touched at all. It blocked two
      # legitimate one-line changes — a CSS class rename could not touch
      # RealChatView or ReelsFeed without also paying 18 unrelated
      # no-explicit-any and 12 react-hooks errors in chat and call code, which
      # cannot be verified without an account and, for the call ones, two
      # devices. The visible consequence was the chat view and the Shots feed
      # staying 480px wide on a desktop because their files were untouchable.
      #
      # It compares each changed file with its baseline now, and fails in BOTH
      # directions: more errors is new debt; fewer means the baseline is stale
      # and must be lowered. Touching a file is when the ratchet clicks.
      - name: Lint changed files (ratchet)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          files=$(git diff --name-only --diff-filter=ACMR \
            "origin/$GITHUB_BASE_REF...HEAD" -- '*.ts' '*.tsx' | tr '\n' ' ')
          node scripts/lint-ratchet.mjs $files

      - name: Typecheck
        run: npm run typecheck

      # The native client, with its OWN TypeScript. It is on 6.0 because
      # Expo 58 pins that, while the web is on 5.9 — so the root tsconfig
      # excludes apps/** and this is the only thing that checks it. Without
      # a step of its own, mobile type errors reach main unnoticed.
      - name: Typecheck the mobile app
        run: npm run typecheck --workspace @hypefy/mobile

      # And that it still BUNDLES, which typechecking does not prove: Metro
      # has to resolve @hypefy/core, @hypefy/tokens and the font assets
      # across the workspace, and a broken metro.config.js or a missing
      # asset fails here rather than on somebody's device.
      #
      # Export, not a native build: no Android SDK, no signing, no EAS
      # login needed. It produces the Hermes bundle, which is the part that
      # can break from a change in this repo.
      - name: Bundle the mobile app
        run: npx expo export --platform android --output-dir /tmp/expo-export
        working-directory: apps/mobile
        env:
          # The client throws at startup without these, and export
          # evaluates module scope. Placeholders: nothing is contacted.
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholders so the build never needs real secrets. App pages are
          # dynamic; the Supabase client is constructed at request time, not at
          # build time, so no network calls happen during the build.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # Playwright. This used to be deferred with the note that "the critical flows
  # need a seeded Supabase test project + a confirmed test user", which was
  # true and is still true of the signed-in flows — they skip here.
  #
  # What changed is that tests/e2e/public-surface.spec.ts needs no account at
  # all: the auth wall, the offline page, the service worker, the manifest, the
  # security headers and the no-sideways-scroll contract. Twelve checks that
  # run anywhere. And tests/e2e/core-flows.spec.ts now SKIPS without
  # credentials rather than failing at import, so this job is honest either way
  # and gets more useful the moment a test account exists.
  e2e:
    runs-on: ubuntu-latest
    env:
      # Public by design — the anon key ships to every browser — but kept in
      # secrets so the repo is not pinned to one Supabase project and the key
      # can be rotated without a commit.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Optional. Unset means the signed-in flows skip; the public ones still run.
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Without a Supabase URL the dev server starts but every page that talks
      # to it fails, and the auth-wall checks would report a redirect that
      # happened for the wrong reason. Better to say so than to pass by
      # accident.
      - name: Skip note when Supabase is not configured
        if: env.NEXT_PUBLIC_SUPABASE_URL == ''
        run: |
          echo "::warning title=E2E not configured::Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY in repo secrets to run the Playwright suite. Add E2E_EMAIL and E2E_PASSWORD for the signed-in flows as well."

      - name: Playwright
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
