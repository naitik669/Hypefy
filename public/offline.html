<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hypefy — Offline</title>
    <style>
      /* Fully self-contained: no external CSS/JS/chunks, so this page can never
         go stale or fail to render when the network is down. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #0a0a0a;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        gap: 14px;
      }
      .mark { width: 96px; height: 96px; }
      .mark rect.h { fill: #fff; }
      .mark rect.dot { fill: #a3e635; }
      h1 {
        font-size: 26px; font-weight: 800; letter-spacing: -0.01em;
        text-transform: uppercase; margin-top: 14px; line-height: 1.2;
      }
      .dot-ink { color: #a3e635; }
      p { font-size: 14px; color: #8a8a8a; max-width: 280px; line-height: 1.5; margin-top: 2px; }
      button {
        margin-top: 12px;
        appearance: none; border: none; cursor: pointer;
        background: #a3e635; color: #0a0a0a;
        font-weight: 800; font-size: 15px;
        padding: 13px 28px; border-radius: 16px;
        transition: transform 0.15s ease;
      }
      button:active { transform: scale(0.96); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="mark" aria-hidden="true" viewBox="0 0 40 40">
        <rect class="h" x="4" y="5.8" width="7" height="28.4" />
        <rect class="h" x="21.8" y="5.8" width="6.8" height="28.4" />
        <rect class="h" x="4" y="16.8" width="24.6" height="5.8" />
        <rect class="dot" x="31.4" y="29.6" width="4.6" height="4.6" />
      </svg>
      <h1>Oops!!! seems like you are offline<span class="dot-ink">.</span></h1>
      <p>The wifi ghosted you, not us.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
